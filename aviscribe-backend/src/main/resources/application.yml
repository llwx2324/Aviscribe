server:
  port: 8082
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    context-path: /api # API 根路径
    encoding:
      enabled: true
      charset: UTF-8
      force: true

spring:
  application:
    name: aviscribe-backend
  lifecycle:
    timeout-per-shutdown-phase: 40s
  # 数据库配置
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aviscribe_db?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # 不提供默认密码，避免开发配置被误用于生产环境。
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  # 异步线程池配置 (见 ThreadPoolConfig.java)
  task:
    execution:
      pool:
        core-size: 4  # 核心线程数 (根据 CPU 核心数调整)
        max-size: 16  # 最大线程数
        queue-capacity: 100 # 队列容量

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: false
      id-type: auto
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 自定义配置
aviscribe:
  jobs:
    recovery-enabled: ${AVISCRIBE_JOB_RECOVERY_ENABLED:true}
  file:
    upload-path: ${AVISCRIBE_UPLOAD_PATH:D:/aviscribe/files/}
    max-upload-size-bytes: ${AVISCRIBE_MAX_UPLOAD_SIZE_BYTES:524288000}
  ffmpeg:
    # Windows 下直接用 PATH 中的 ffmpeg，可留空或写 "ffmpeg"
    path: "ffmpeg"
  stt:
    # 使用用户已有的环境变量名：ALIYUN_NLS_APP_KEY / ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET
    app-key: ${ALIYUN_NLS_APP_KEY:}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    # NLS FileTrans 网关配置（来自官方示例）
    region-id: "cn-shanghai"
    endpoint-name: "cn-shanghai"
    product: "nls-filetrans"
    domain: "filetrans.cn-shanghai.aliyuncs.com"
    api-version: "2018-08-17"  # 中国站版本
    # 录音文件识别提交/查询的 Action 名称
    submit-action: "SubmitTask"
    query-action: "GetTaskResult"
    # 轮询参数
    max-poll-times: 60
    poll-interval-ms: 3000
    # 仍保留本地回退 URL（理论上不会再使用）
    public-audio-base-url: "http://127.0.0.1:8090/audio/"
  oss:
    # OSS 访问配置：endpoint 与 bucket 名称
    endpoint: "https://oss-cn-shanghai.aliyuncs.com"
    bucket: "aviscribe"
    # 默认复用 ALIYUN_ACCESS_KEY_ID / SECRET，如需单独配置可显式设置这两个字段
    # access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    # access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    # 存储音频文件的对象前缀，可按需调整（末尾不加 / 也可以）
    object-prefix: "audio"
    # 是否为每个对象生成带过期时间的签名 URL；若 bucket/object 设置为公共读，可设为 false 直接拼公共 URL
    use-signed-url: true
    # 签名 URL 过期时间（秒），默认 24 小时
    signed-url-expire-seconds: 86400
  llm:
    # DeepSeek (OpenAI 兼容) 配置，从环境变量读取
    api-key: ${DS_API_KEY:}
    base-url: ${DS_BASE_URL:https://api.deepseek.com}
    model: ${DS_MODEL:deepseek-chat}
    max-concurrent: 1 # LLM 排版同时并发数，避免触发限流
    acquire-timeout-ms: 120000 # 获取排版令牌的最长等待时间
    retry:
      max-attempts: 3 # 触发限流/网络错误时的重试次数
      backoff-ms: 2000 # 每次重试之间的基础退避时间
  downloader:
    # yt-dlp 可执行文件路径，确保已安装并在 PATH 中，或写绝对路径，例如 "C:/tools/yt-dlp.exe"
    yt-dlp-path: "yt-dlp"
    max-download-size-bytes: ${AVISCRIBE_MAX_DOWNLOAD_SIZE_BYTES:524288000}
    connect-timeout-ms: ${AVISCRIBE_DOWNLOAD_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${AVISCRIBE_DOWNLOAD_READ_TIMEOUT_MS:30000}
    process-timeout-seconds: ${AVISCRIBE_DOWNLOAD_PROCESS_TIMEOUT_SECONDS:1800}
  security:
    jwt:
      # 必填，长度至少 32 字节；缺失时应用应拒绝启动。
      secret: ${AVISCRIBE_JWT_SECRET}
      access-exp-minutes: 120 
      refresh-exp-days: 14 
    rate-limit:
      auth:
        max-requests: 10
        window-seconds: 60

logging:
  level:
    com.aviscribe: ${AVISCRIBE_LOG_LEVEL:info}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
